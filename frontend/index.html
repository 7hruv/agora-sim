<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agora - Social Simulation</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }
        h1 { text-align: center; margin-bottom: 20px; color: #00d9ff; }
        .container {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .panel {
            background: #16213e;
            border-radius: 8px;
            padding: 20px;
        }
        .agent-card {
            background: #0f3460;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .agent-name { font-size: 1.3em; font-weight: bold; margin-bottom: 8px; }
        .agent-traits { font-size: 0.9em; color: #aaa; margin-bottom: 8px; }
        .mood-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: bold;
        }
        .mood-happy { background: #27ae60; }
        .mood-neutral { background: #7f8c8d; }
        .mood-annoyed { background: #e67e22; }
        .mood-sad { background: #c0392b; }
        .agent-stats { margin-top: 10px; font-size: 0.95em; }
        .chat-feed {
            height: 500px;
            overflow-y: auto;
            background: #0f3460;
            border-radius: 8px;
            padding: 15px;
        }
        .event {
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 6px;
            border-left: 4px solid;
        }
        .event-trade { border-color: #27ae60; background: rgba(39, 174, 96, 0.1); }
        .event-refuse { border-color: #e74c3c; background: rgba(231, 76, 60, 0.1); }
        .event-chat { border-color: #3498db; background: rgba(52, 152, 219, 0.1); }
        .event-ignore { border-color: #95a5a6; background: rgba(149, 165, 156, 0.1); }
        .event-other { border-color: #9b59b6; background: rgba(155, 89, 182, 0.1); }
        .event-round { font-size: 0.8em; color: #888; }
        .event-actor { font-weight: bold; }
        .event-action { color: #00d9ff; }
        .event-dialogue { font-style: italic; margin-top: 5px; }
        .controls { text-align: center; margin-bottom: 20px; }
        .round-display {
            font-size: 2em;
            font-weight: bold;
            color: #00d9ff;
            margin-bottom: 15px;
        }
        button {
            background: #00d9ff;
            color: #1a1a2e;
            border: none;
            padding: 10px 25px;
            margin: 5px;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #00b8d4; }
        button.danger { background: #e74c3c; color: white; }
        button.danger:hover { background: #c0392b; }
        .toggle-btn.active { background: #27ae60; color: white; }
        .event-log {
            height: 200px;
            overflow-y: auto;
            background: #0a0a15;
            border-radius: 8px;
            padding: 10px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.8em;
            color: #888;
        }
        .log-entry { margin-bottom: 5px; }
        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <h1>🏛️ Agora - Social Simulation</h1>
    
    <div class="container">
        <!-- LEFT COLUMN: Agents Panel -->
        <div class="panel">
            <h2 style="margin-bottom: 15px;">Agents</h2>
            <div id="agents-container"></div>
        </div>
        
        <!-- CENTER COLUMN: Chat Feed -->
        <div class="panel">
            <h2 style="margin-bottom: 15px;">Chat Feed</h2>
            <div id="chat-feed" class="chat-feed"></div>
        </div>
        
        <!-- RIGHT COLUMN: Controls + Log -->
        <div class="panel">
            <h2 style="margin-bottom: 15px;">Controls</h2>
            <div class="controls">
                <div id="round-display" class="round-display">Round: 0</div>
                <button id="next-round-btn">Next Round</button>
                <button id="auto-toggle-btn" class="toggle-btn">Auto: OFF</button>
                <button id="reset-btn" class="danger">Reset World</button>
            </div>
            <h3 style="margin: 20px 0 10px;">Event Log</h3>
            <div id="event-log" class="event-log"></div>
        </div>
    </div>

    <script>
        let autoInterval = null;
        let isAuto = false;

        function getMoodClass(mood) {
            return 'mood-' + mood.toLowerCase();
        }

        function renderAgents(agents) {
            const container = document.getElementById('agents-container');
            container.innerHTML = agents.map(agent => `
                <div class="agent-card">
                    <div class="agent-name">${agent.name}</div>
                    <div class="agent-traits">${agent.traits}</div>
                    <span class="mood-badge ${getMoodClass(agent.mood)}">${agent.mood.toUpperCase()}</span>
                    <div class="agent-stats">
                        <div>💰 Coins: ${agent.money}</div>
                        <div>📦 Inventory: ${agent.inventory}</div>
                    </div>
                </div>
            `).join('');
        }

        function getEventClass(action) {
            const actionLower = action.toLowerCase();
            if (actionLower.includes('trade') || actionLower.includes('accept')) return 'event-trade';
            if (actionLower.includes('refuse')) return 'event-refuse';
            if (actionLower.includes('chat')) return 'event-chat';
            if (actionLower.includes('ignore')) return 'event-ignore';
            return 'event-other';
        }

        function renderEvents(events) {
            const feed = document.getElementById('chat-feed');
            feed.innerHTML = events.map(ev => `
                <div class="event ${getEventClass(ev.action)}">
                    <div class="event-round">Round ${ev.round}</div>
                    <div><span class="event-actor">${ev.actor}</span> 
                        <span class="event-action">${ev.action}</span> → ${ev.target}</div>
                    <div class="event-dialogue">"${ev.dialogue}"</div>
                </div>
            `).join('');
            feed.scrollTop = feed.scrollHeight;
        }

        function renderLog(events) {
            const log = document.getElementById('event-log');
            log.innerHTML = events.map(ev => 
                `<div class="log-entry">[${new Date(ev.created_at).toLocaleTimeString()}] R${ev.round} ${ev.actor} ${ev.action} → ${ev.target}</div>`
            ).join('');
            log.scrollTop = log.scrollHeight;
        }

        async function loadState() {
            try {
                const res = await fetch('/state');
                const data = await res.json();
                document.getElementById('round-display').textContent = `Round: ${data.round}`;
                renderAgents(data.agents);
                renderEvents(data.recent_events);
            } catch (err) {
                console.error('Failed to load state:', err);
            }
        }

        async function runNextRound() {
            try {
                const res = await fetch('/next-round', { method: 'POST' });
                const data = await res.json();
                await loadState();
            } catch (err) {
                console.error('Failed to run round:', err);
            }
        }

        async function resetWorld() {
            if (!confirm('Are you sure you want to reset the world?')) return;
            try {
                await fetch('/reset', { method: 'POST' });
                await loadState();
                document.getElementById('event-log').innerHTML = '';
            } catch (err) {
                console.error('Failed to reset:', err);
            }
        }

        function toggleAuto() {
            isAuto = !isAuto;
            const btn = document.getElementById('auto-toggle-btn');
            if (isAuto) {
                btn.classList.add('active');
                btn.textContent = 'Auto: ON';
                autoInterval = setInterval(runNextRound, 5000);
            } else {
                btn.classList.remove('active');
                btn.textContent = 'Auto: OFF';
                if (autoInterval) clearInterval(autoInterval);
            }
        }

        // Initialize
        document.getElementById('next-round-btn').addEventListener('click', runNextRound);
        document.getElementById('auto-toggle-btn').addEventListener('click', toggleAuto);
        document.getElementById('reset-btn').addEventListener('click', resetWorld);

        // Initial load
        loadState();
    </script>
</body>
</html>
